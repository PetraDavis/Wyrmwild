<title>Wyrmwild Monsters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@600;700&family=Nunito+Sans:wght@400;700;800&display=swap">
<style>
/* Layout: full-screen 3D stage, monster card top-left, monster picker along the bottom */
:root {
  --night: #141a26;
  --plate: rgba(14, 18, 28, 0.72);
  --ink: #f3ece2;
  --muted: #bdb5aa;
  --ember: #ff9a48;
  --line: rgba(255, 220, 190, 0.18);
  --display: "Grenze", Georgia, serif;
  --body: "Nunito Sans", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.plate { background: var(--plate); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); }
#card {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 12px 16px; width: min(330px, calc(100% - 32px)); box-sizing: border-box;
}
#card h1 { font-family: var(--display); font-size: 2rem; line-height: 1; margin: 0; }
#card .land { margin: 6px 0 8px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ember); font-weight: 800; }
#card ul { margin: 0; padding-left: 18px; color: var(--ink); font-size: 0.9rem; line-height: 1.45; }
#card .hint { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }
.dock {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
}
.dock button {
  font: 800 0.9rem var(--body); color: var(--ink); cursor: pointer; background: var(--plate);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; backdrop-filter: blur(6px);
}
.dock button[aria-pressed="true"] { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember) inset; }
.dock button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
</style>

<div id="stage"></div>
<div id="card" class="plate">
  <h1 id="nm">Goblin</h1>
  <p class="land" id="land">Green Valley</p>
  <ul id="ad"></ul>
  <p class="hint">Drag to spin · scroll or pinch to zoom</p>
</div>
<div class="dock" id="dock"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
const V = THREE.Vector3;
const C = h => new THREE.Color(h).convertSRGBToLinear();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const stage = document.getElementById("stage"); stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100); camera.position.set(3.6, 2.4, 5.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.minDistance = 2.5; controls.maxDistance = 12; controls.maxPolarAngle = Math.PI * 0.49; controls.enablePan = false;
scene.add(new THREE.HemisphereLight("#b9c8ff", "#3b2a1c", 0.7));
const key = new THREE.DirectionalLight("#fff0dc", 1.2); key.position.set(4, 7, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 }); key.shadow.bias = -0.0008;
scene.add(key);
const rim = new THREE.DirectionalLight("#7fa6ff", 0.6); rim.position.set(-5, 3, -4); scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshStandardMaterial({ roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------- helpers ----------
const std = (hex, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: C(hex), roughness: 0.6 }, o));
function mesh(geo, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; m.receiveShadow = true; return m;
}
const sph = (r, w = 24, h = 16) => new THREE.SphereGeometry(r, w, h);
function limb(a, b, r1, r2, mat) { // tapered cylinder from point a to point b
  const d = new V().subVectors(b, a), len = d.length();
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, 12), mat);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new V(0, 1, 0), d.normalize());
  return m;
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; return t;
}
function blotch(base, spots, n, size) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) { g.fillStyle = spots[i % spots.length]; g.globalAlpha = 0.55; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, size * (0.5 + Math.random()), size * (0.3 + Math.random() * 0.6), Math.random() * 3, 0, Math.PI * 2); g.fill(); }
  });
}
function eyes(g, x, y, z, r, color, pupil = true) {
  const em = new THREE.MeshBasicMaterial({ color: C(color) });
  [1, -1].forEach(s => {
    g.add(mesh(sph(r, 16, 12), em, x, y, z * s));
    if (pupil) g.add(mesh(sph(r * 0.45, 10, 8), new THREE.MeshBasicMaterial({ color: "#120a06" }), x + r * 0.75, y, z * s + r * 0.15 * s));
  });
}

// ---------- monsters ----------
const MON = [];

// Goblin: blotchy green camo, big ears, long climbing fingers
MON.push({ name: "Goblin", land: "Green Valley", ground: "#3f6b35", ad: [
  "Blotchy green skin hides it in grass and bushes", "Big ears hear dragons coming from far away", "Long fingers and toes for climbing trees"],
  make() {
    const g = new THREE.Group(), skin = std("#7fae4a", { map: blotch("#7fae4a", ["#4f7d2e", "#a8c46a", "#3a5f24"], 70, 18) }),
      cloth = std("#6b4a2a"), leaf = std("#3f7d34", { side: THREE.DoubleSide }), nail = std("#e8dcb8");
    g.add(mesh(sph(0.42), skin, 0, 0.95, 0, 0.9, 1.05, 0.85));        // round belly
    g.add(mesh(sph(0.3), skin, 0.12, 1.5, 0, 1.05, 0.95, 0.95));       // head, hunched forward
    g.add(mesh(sph(0.14), skin, 0.38, 1.44, 0, 1.2, 0.8, 0.9));        // long nose
    eyes(g, 0.32, 1.58, 0.13, 0.065, "#ffd23a");
    [1, -1].forEach(s => {
      const ear = mesh(new THREE.ConeGeometry(0.12, 0.55, 12), skin, 0.02, 1.6, 0.36 * s);
      ear.rotation.x = s * 1.35; ear.rotation.z = 0.25; ear.scale.z = 0.35; g.add(ear);
      g.add(limb(new V(0, 1.15, 0.33 * s), new V(0.15, 0.75, 0.5 * s), 0.08, 0.06, skin));      // arm
      g.add(limb(new V(0.15, 0.75, 0.5 * s), new V(0.3, 0.45, 0.48 * s), 0.06, 0.05, skin));
      for (let f = -1; f <= 1; f++) {                                                                // long fingers
        const a = new V(0.3, 0.45, 0.48 * s), b = new V(0.42, 0.22, 0.48 * s + f * 0.07);
        g.add(limb(a, b, 0.025, 0.015, skin)); const n = mesh(new THREE.ConeGeometry(0.018, 0.06, 6), nail); n.position.copy(b); n.rotation.z = Math.PI; g.add(n);
      }
      g.add(limb(new V(0, 0.7, 0.2 * s), new V(0.12, 0.38, 0.24 * s), 0.11, 0.07, skin));       // legs
      g.add(limb(new V(0.12, 0.38, 0.24 * s), new V(-0.02, 0.06, 0.24 * s), 0.07, 0.05, skin));
      g.add(mesh(sph(0.1), skin, 0.12, 0.04, 0.24 * s, 2.2, 0.5, 1.1));                              // long feet
    });
    g.add(mesh(new THREE.CylinderGeometry(0.4, 0.46, 0.22, 16), cloth, 0, 0.72, 0));
    for (let i = 0; i < 7; i++) { const l = mesh(new THREE.CircleGeometry(0.12, 8), leaf, 0, 0.62, 0); const a = i / 7 * Math.PI * 2; l.position.set(Math.cos(a) * 0.44, 0.6, Math.sin(a) * 0.44); l.rotation.y = -a + Math.PI / 2; l.scale.y = 1.6; g.add(l); }
    return { g, update: t => { g.position.y = Math.abs(Math.sin(t * 2.4)) * 0.04; g.rotation.z = Math.sin(t * 1.2) * 0.03; } };
  } });

// Bog Toad: flat floating body, webbed feet, eyes on top, slimy
MON.push({ name: "Bog Toad", land: "Green Valley ponds", ground: "#3e4a32", ad: [
  "Wide, flat body that floats on the water", "Eyes on top of its head watch while it hides underwater", "Webbed feet for swimming", "Slimy, shiny skin that stays wet"],
  make() {
    const g = new THREE.Group(), skin = std("#3c7c8c", { roughness: 0.18, metalness: 0.1, map: blotch("#3c7c8c", ["#25525e", "#6fa6a0", "#2b6650"], 60, 16) }),
      belly = std("#c9d6a0", { roughness: 0.25 }), web = std("#2e6a78", { roughness: 0.2, side: THREE.DoubleSide });
    g.add(mesh(sph(0.7, 32, 20), skin, 0, 0.42, 0, 1.15, 0.55, 1.05));
    belly.userData.m = mesh(sph(0.6, 28, 16), belly, 0.05, 0.3, 0, 1.05, 0.38, 0.95); g.add(belly.userData.m);
    g.add(mesh(sph(0.45, 28, 16), skin, 0.55, 0.52, 0, 0.9, 0.45, 1.05));                  // broad head
    [1, -1].forEach(s => {
      g.add(mesh(sph(0.15, 18, 12), skin, 0.6, 0.78, 0.22 * s));                           // eye bumps on top
      g.add(mesh(sph(0.1, 16, 12), new THREE.MeshBasicMaterial({ color: C("#f2d64a") }), 0.68, 0.84, 0.22 * s));
      g.add(mesh(new THREE.BoxGeometry(0.03, 0.02, 0.12), new THREE.MeshBasicMaterial({ color: "#120a06" }), 0.77, 0.86, 0.22 * s));
      g.add(limb(new V(-0.45, 0.35, 0.55 * s), new V(-0.75, 0.2, 0.85 * s), 0.16, 0.1, skin)); // big back legs
      g.add(limb(new V(-0.75, 0.2, 0.85 * s), new V(-0.45, 0.05, 1.0 * s), 0.1, 0.07, skin));
      g.add(limb(new V(0.45, 0.25, 0.5 * s), new V(0.6, 0.06, 0.62 * s), 0.08, 0.06, skin));
      // webbed feet: a fan with toes
      [[-0.45, 0.05, 1.0, 0.38], [0.6, 0.04, 0.62, 0.24]].forEach(([x, y, z, r]) => {
        const f = mesh(new THREE.CircleGeometry(r, 16, -0.9, 1.8), web, x, y, z * s); f.rotation.x = -Math.PI / 2; f.rotation.z = s > 0 ? 0.4 : -0.4; g.add(f);
      });
    });
    { const mouth = mesh(new THREE.TorusGeometry(0.34, 0.025, 6, 24, Math.PI * 0.9), std("#1b3a3e"), 0.82, 0.42, 0, 1, 0.6, 1.2); mouth.rotation.set(Math.PI / 2, 0, Math.PI * 0.55); g.add(mouth); }
    // puddle
    const pud = mesh(new THREE.CircleGeometry(1.8, 40), std("#4f8fb0", { roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.75 }), 0, 0.02, 0);
    pud.rotation.x = -Math.PI / 2; pud.castShadow = false; g.add(pud);
    return { g, update: t => { const b = 1 + Math.sin(t * 3) * 0.04; belly.userData.m.scale.y = 0.38 * b; g.rotation.y = Math.sin(t * 0.5) * 0.1; } };
  } });

// Lava Imp: small, black cracked skin glowing inside, bat wings
MON.push({ name: "Lava Imp", land: "Fire Mountain", ground: "#2a201c", ad: [
  "Small and quick, it darts between hot rocks", "Black, cracked skin that can't burn, glowing orange inside", "Bat-like wings ride the hot air rising from lava"],
  make() {
    const g = new THREE.Group();
    const crackMap = canvasTex(256, 256, (x, w, h) => {
      x.fillStyle = "#000"; x.fillRect(0, 0, w, h); x.strokeStyle = "#ff8a2a"; x.lineWidth = 3; x.shadowColor = "#ffb04a"; x.shadowBlur = 6;
      for (let i = 0; i < 26; i++) { x.beginPath(); let px = Math.random() * w, py = Math.random() * h; x.moveTo(px, py); for (let k = 0; k < 5; k++) { px += (Math.random() - 0.5) * 50; py += (Math.random() - 0.5) * 50; x.lineTo(px, py); } x.stroke(); }
    });
    const skin = std("#1d1614", { roughness: 0.8, emissive: new THREE.Color("#ffffff"), emissiveMap: crackMap, emissiveIntensity: 1.6 }),
      wing = std("#2a1a16", { side: THREE.DoubleSide, emissive: C("#ff5a1a"), emissiveIntensity: 0.15 }), horn = std("#3a2a24");
    const body = new THREE.Group(); g.add(body);
    body.add(mesh(sph(0.3), skin, 0, 1.1, 0, 0.9, 1.1, 0.85));
    body.add(mesh(sph(0.25), skin, 0.05, 1.5, 0, 1, 0.95, 0.95));
    eyes(body, 0.24, 1.55, 0.1, 0.055, "#ffe36a", false);
    [1, -1].forEach(s => {
      const h = mesh(new THREE.ConeGeometry(0.05, 0.3, 10), horn, -0.02, 1.75, 0.12 * s); h.rotation.set(s * 0.4, 0, -0.35); body.add(h);
      body.add(limb(new V(0, 1.25, 0.24 * s), new V(0.15, 0.95, 0.32 * s), 0.06, 0.04, skin));
      body.add(limb(new V(0, 0.9, 0.12 * s), new V(0.05, 0.62, 0.15 * s), 0.07, 0.04, skin));
      // bat wing
      const shape = new THREE.Shape(); shape.moveTo(0, 0); shape.lineTo(0.2, 0.75); shape.quadraticCurveTo(0.3, 0.55, 0.55, 0.62);
      shape.quadraticCurveTo(0.55, 0.35, 0.8, 0.3); shape.quadraticCurveTo(0.6, 0.1, 0.75, -0.1); shape.quadraticCurveTo(0.35, -0.05, 0, -0.2);
      const wg = new THREE.Group(); wg.position.set(-0.12, 1.3, 0.12 * s); body.add(wg);
      const wm = mesh(new THREE.ShapeGeometry(shape, 12), wing); wm.rotation.set(0, s > 0 ? -Math.PI / 2 : Math.PI / 2, 0); wm.scale.set(1.1, 1.1, 1); wg.add(wm);
      wg.userData.s = s; body.userData["w" + s] = wg;
    });
    // tail with a glowing tip
    const pts = [new V(-0.2, 0.95, 0), new V(-0.5, 0.75, 0), new V(-0.75, 0.85, 0), new V(-0.85, 1.05, 0)];
    body.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, 0.035, 8), skin));
    body.add(mesh(new THREE.ConeGeometry(0.07, 0.16, 4), new THREE.MeshBasicMaterial({ color: C("#ffb04a") }), -0.86, 1.12, 0));
    const glow = new THREE.PointLight("#ff7a2a", 1.2, 3, 2); glow.position.set(0, 1.1, 0); g.add(glow);
    return { g, update: t => {
      body.position.y = 0.25 + Math.sin(t * 3) * 0.12;
      [1, -1].forEach(s => { body.userData["w" + s].rotation.x = s * (0.2 + Math.sin(t * 14) * 0.6); });
      skin.emissiveIntensity = 1.4 + Math.sin(t * 4) * 0.3;
    } };
  } });

// Rock Troll: boulder hide, huge arms, tiny eyes
MON.push({ name: "Rock Troll", land: "Fire Mountain", ground: "#4a3a30", ad: [
  "Stony, heat-proof hide that looks like boulders, so it hides by standing still", "Huge arms for throwing rocks", "Tiny eyes keep out the falling ash"],
  make() {
    const g = new THREE.Group(), rock = std("#7c7064", { flatShading: true, roughness: 0.95 }), dark = std("#5c524a", { flatShading: true, roughness: 0.95 }), moss = std("#5a6a3a", { flatShading: true });
    const chunk = (r, mat, x, y, z, sx = 1, sy = 1, sz = 1) => { const m = mesh(new THREE.DodecahedronGeometry(r, 1), mat, x, y, z, sx, sy, sz); m.rotation.set(Math.random(), Math.random(), Math.random()); return m; };
    g.add(chunk(0.8, rock, 0, 1.45, 0, 1.0, 1.05, 0.95));
    g.add(chunk(0.55, dark, -0.15, 2.15, 0, 1.2, 0.8, 1.2));       // hunched shoulders
    g.add(chunk(0.32, rock, 0.55, 2.05, 0, 1.1, 0.9, 1));          // small head pushed forward
    eyes(g, 0.82, 2.1, 0.11, 0.035, "#ff9a3a", false);
    [1, -1].forEach(s => {
      g.add(chunk(0.38, dark, 0.05, 2.0, 0.75 * s));                 // shoulder boulder
      g.add(chunk(0.32, rock, 0.25, 1.4, 0.95 * s, 1, 1.3, 1));      // huge arm
      g.add(chunk(0.36, dark, 0.4, 0.75, 1.0 * s, 1.1, 1, 1.1));     // big fist
      g.add(chunk(0.32, rock, 0.05, 0.45, 0.4 * s, 1, 1.3, 1));      // stumpy legs
      g.add(chunk(0.28, dark, 0.15, 0.12, 0.42 * s, 1.5, 0.5, 1.1));
      g.add(chunk(0.12, moss, -0.3, 2.45, 0.3 * s));
    });
    g.add(chunk(0.28, rock, 1.0, 0.3, 1.4));                         // a rock to throw
    return { g, update: t => { g.rotation.y = Math.sin(t * 0.4) * 0.06; g.position.y = Math.sin(t * 1.3) * 0.015; } };
  } });

// Ice Wraith: floating see-through blue, no legs, frost trail
MON.push({ name: "Ice Wraith", land: "Frost Peaks", ground: "#dfe8f0", ad: [
  "See-through blue, so it's hard to spot against ice", "No legs: it glides over snow without sinking", "Leaves a frosty trail behind it"],
  make() {
    const g = new THREE.Group();
    const ice = new THREE.MeshPhysicalMaterial({ color: C("#9fd6ff"), roughness: 0.15, transmission: 0, transparent: true, opacity: 0.55, emissive: C("#4aa8ff"), emissiveIntensity: 0.25, side: THREE.DoubleSide, depthWrite: false });
    const body = new THREE.Group(); g.add(body);
    const pts = []; for (let i = 0; i <= 12; i++) { const y = i / 12; pts.push(new THREE.Vector2(0.05 + Math.sin(y * Math.PI * 0.85) * 0.55 * (1 - y * 0.35) + (i === 0 ? 0 : Math.sin(i * 2.3) * 0.03), y * 1.6)); }
    const robe = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), ice); robe.position.y = 0.4; body.add(robe);
    body.add(mesh(sph(0.3), ice, 0, 2.2, 0, 0.9, 1.1, 0.9));
    eyes(body, 0.22, 2.25, 0.1, 0.06, "#dff6ff", false);
    [1, -1].forEach(s => {
      const arm = mesh(new THREE.ConeGeometry(0.1, 0.9, 10, 1, true), ice, 0.25, 1.55, 0.45 * s); arm.rotation.set(s * 0.9, 0, -0.6); body.add(arm);
    });
    for (let i = 0; i < 6; i++) { const c = mesh(new THREE.ConeGeometry(0.05, 0.3, 6), ice, 0, 2.5, 0); const a = i / 6 * Math.PI * 2; c.position.set(Math.cos(a) * 0.18, 2.45, Math.sin(a) * 0.18); c.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5); body.add(c); }
    // frost trail particles
    const n = 120, pos = new Float32Array(n * 3), life = new Float32Array(n);
    for (let i = 0; i < n; i++) life[i] = Math.random();
    const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const trail = new THREE.Points(pg, new THREE.PointsMaterial({ color: C("#e6f6ff"), size: 0.07, transparent: true, opacity: 0.85, depthWrite: false })); g.add(trail);
    const light = new THREE.PointLight("#7cc4ff", 0.8, 4, 2); light.position.y = 1.5; g.add(light);
    return { g, update: (t, dt) => {
      body.position.y = 0.15 + Math.sin(t * 1.6) * 0.1; body.rotation.z = Math.sin(t * 1.1) * 0.05;
      for (let i = 0; i < n; i++) {
        life[i] += dt * 0.5; if (life[i] > 1) life[i] -= 1;
        const a = i * 2.39, r = 0.3 + life[i] * 0.9;
        pos[i * 3] = -life[i] * 1.6 + Math.cos(a) * 0.15; pos[i * 3 + 1] = 0.5 + Math.sin(a * 3) * 0.2 - life[i] * 0.45; pos[i * 3 + 2] = Math.sin(a) * r * 0.5;
      }
      pg.attributes.position.needsUpdate = true;
    } };
  } });

// Snow Yeti: thick white fur, snowshoe feet, round heavy body
MON.push({ name: "Snow Yeti", land: "Frost Peaks", ground: "#e6edf3", ad: [
  "Thick white fur keeps it warm and hides it in snow", "Big flat feet work like snowshoes", "A round, heavy body holds in heat"],
  make() {
    const g = new THREE.Group();
    const furTex = canvasTex(256, 256, (x, w, h) => { x.fillStyle = "#f2f4f8"; x.fillRect(0, 0, w, h); x.strokeStyle = "rgba(150,170,200,0.35)"; x.lineWidth = 2; for (let i = 0; i < 900; i++) { const px = Math.random() * w, py = Math.random() * h; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (Math.random() - 0.5) * 6, py + 10); x.stroke(); } });
    const fur = std("#f2f4f8", { map: furTex, roughness: 0.95 }), face = std("#7b9cc4", { roughness: 0.7 }), claw = std("#3a4250");

      const l = new THREE.Group(); l.position.set(x, 0.85, z); body.add(l);
      l.add(limb(new V(0, 0, 0), new V(x > 0 ? 0.05 : -0.1, -0.45, 0), 0.12, 0.08, fur));

      l.add(mesh(sph(0.12, 14, 10), fur, 0.05, -0.8, 0, 1.5, 0.55, 1.3));             // wide paw
      for (let c = -1; c <= 1; c++) { const cl = mesh(new THREE.ConeGeometry(0.018, 0.06, 5), claw, 0.22, -0.82, c * 0.06); cl.rotation.z = -Math.PI / 2; l.add(cl); }

    const tail = new THREE.Group(); tail.position.set(-0.75, 1.1, 0); body.add(tail);

// Storm Harpy: huge wings, light hollow body, sharp talons, crackling storm feathers
MON.push({ name: "Storm Harpy", land: "Sky Islands", ground: "#c8d4e4", ad: [

  make() {

      tip = std("#2a3450", { side: THREE.DoubleSide }), talon = std("#f0d24a", { roughness: 0.4 }), beak = std("#e8b830", { roughness: 0.4 }),

    head.add(mesh(sph(0.2, 16, 12), feather));
    const bk = mesh(new THREE.ConeGeometry(0.07, 0.24, 8), beak, 0.25, -0.03, 0); bk.rotation.z = -Math.PI / 2 - 0.3; head.add(bk);
    eyes(head, 0.12, 0.06, 0.12, 0.04, "#aef0ff");
    for (let i = 0; i < 5; i++) { const c = mesh(new THREE.ConeGeometry(0.03, 0.35, 5), tip, -0.12 - i * 0.03, 0.16, (i - 2) * 0.05); c.rotation.z = 1.0 + i * 0.05; head.add(c); }  // storm crest
    const wings = [];
    [1, -1].forEach(s => {
      const w = new THREE.Group(); w.position.set(0.05, 0.12, 0.25 * s); body.add(w);
      const arm = new THREE.Group(); w.add(arm);
      for (let i = 0; i < 9; i++) {
        const f = mesh(new THREE.PlaneGeometry(0.6 + i * 0.05, 0.24), i > 5 ? tip : (i % 2 ? feather : pale));
        f.rotation.x = Math.PI / 2; f.position.set(-0.22 - i * 0.02, i * 0.004, (0.15 + i * 0.15) * s); f.rotation.z = -0.1 - i * 0.05; arm.add(f);

      for (let k = -1; k <= 1; k++) { const c = limb(new V(0.05, -0.6, 0.14 * s), new V(0.2, -0.68, 0.14 * s + k * 0.06), 0.022, 0.006, tip); body.add(c); }

    // lightning zaps

      bolts.forEach((b, i) => {
        b.line.visible = on;
        if (on) { const s = i % 2 ? 1 : -1; b.pts.forEach((p, k) => p.set(-0.3 + Math.random() * 0.4, 0.1 + (Math.random() - 0.5) * 0.25, s * (0.3 + k * 0.28))); b.line.geometry.setFromPoints(b.pts); }

// Cloud Jelly: floaty see-through bell, stinging tentacles, glows in storms
MON.push({ name: "Cloud Jelly", land: "Sky Islands", ground: "#c8d4e4", ad: [
  "A bell full of light gas lets it float in the sky", "See-through body hides it inside clouds", "Long dangling tentacles sting anything that flies too close", "Glows softly, and brighter when a storm is coming"],
  make() {
    const g = new THREE.Group();
    const bellM = new THREE.MeshPhysicalMaterial({ color: C("#e8f0ff"), roughness: 0.2, transparent: true, opacity: 0.55, emissive: C("#b49cff"), emissiveIntensity: 0.35, side: THREE.DoubleSide, depthWrite: false });
    const innerM = new THREE.MeshBasicMaterial({ color: C("#c8a8ff"), transparent: true, opacity: 0.6 });
    const cloudM = std("#ffffff", { roughness: 1, transparent: true, opacity: 0.9 });
    const body = new THREE.Group(); g.add(body);
    const pts = []; for (let i = 0; i <= 14; i++) { const a = i / 14 * Math.PI * 0.55; pts.push(new THREE.Vector2(Math.sin(a) * 0.75 * (1 + (i > 11 ? (i - 11) * 0.04 : 0)), Math.cos(a) * 0.6)); }
    const bell = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), bellM); body.add(bell);
    body.add(mesh(sph(0.25, 16, 12), innerM, 0, 0.25, 0, 1, 0.7, 1));
    for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2; body.add(mesh(sph(0.12, 10, 8), innerM, Math.cos(a) * 0.3, 0.12, Math.sin(a) * 0.3, 1, 0.4, 0.6)); }
    // tentacles: chains of points updated each frame
    const tents = [];
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2, r = i % 2 ? 0.55 : 0.3, n = 14, len = i % 2 ? 1.8 : 1.2;
      const geo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: n }, () => new V()));
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: C(i % 2 ? "#d8c8ff" : "#ffd8f0"), transparent: true, opacity: 0.85 })); body.add(line);
      const knobs = []; for (let k = 3; k < n; k += 3) { const kn = mesh(sph(0.025, 8, 6), innerM); body.add(kn); knobs.push([k, kn]); }
      tents.push({ a, r, n, len, line, knobs });
    }
    // little cloud puffs it drifts in
    const puffs = new THREE.Group(); g.add(puffs);
    for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + 0.4, cx = Math.cos(a) * 1.6, cz = Math.sin(a) * 1.6, cy = 0.6 + (i % 2) * 0.6; for (let k = 0; k < 5; k++) puffs.add(mesh(sph(0.16 + Math.random() * 0.1, 14, 10), cloudM, cx + (k - 2) * 0.16, cy + (k % 2) * 0.1, cz + (Math.random() - 0.5) * 0.15)); }
    const light = new THREE.PointLight("#c0a8ff", 0.8, 4, 2); light.position.y = 0.2; body.add(light);
    const tmp = []; for (let k = 0; k < 14; k++) tmp.push(new V());
    return { g, update: t => {
      const pulse = Math.sin(t * 2.0);
      body.position.y = 1.6 + Math.sin(t * 0.8) * 0.15 + pulse * 0.04; bell.scale.set(1 - pulse * 0.06, 1 + pulse * 0.08, 1 - pulse * 0.06);
      bellM.emissiveIntensity = 0.35 + (Math.sin(t * 0.4) > 0.6 ? 0.4 : 0) + pulse * 0.05;
      puffs.rotation.y = t * 0.08;
      tents.forEach(o => {
        for (let k = 0; k < o.n; k++) { const u = k / (o.n - 1); tmp[k].set(Math.cos(o.a) * o.r * (1 - u * 0.3) + Math.sin(t * 1.5 + u * 4 + o.a) * 0.12 * u, -u * o.len, Math.sin(o.a) * o.r * (1 - u * 0.3) + Math.cos(t * 1.3 + u * 4 + o.a) * 0.12 * u); }
        o.line.geometry.setFromPoints(tmp.slice(0, o.n)); o.knobs.forEach(([k, kn]) => kn.position.copy(tmp[k]));
      });
    } };
  } });

// Gust Sprite: tiny swirling wind spirit, flies in swarms
MON.push({ name: "Gust Sprite", land: "Sky Islands", ground: "#c8d4e4", ad: [
  "Made mostly of spinning air, so it weighs almost nothing", "Tiny and fast: it darts around faster than a dragon can turn", "Flies in swarms that push dragons off course", "See-through swirl blends in with the wind"],

      for (let i = 0; i < 3; i++) { const ring = mesh(new THREE.TorusGeometry(0.22 + i * 0.09, 0.012, 6, 32, Math.PI * 1.3), windM); ring.rotation.x = Math.PI / 2; ring.position.y = -0.1 - i * 0.12; ring.scale.setScalar(1 - i * 0.25); swirl.add(ring); }

// Puffcap: floating balloon mushroom that bursts into spores
MON.push({ name: "Puffcap", land: "Sky Islands", ground: "#c8d4e4", ad: [
  "Its cap is a balloon of light gas, so it floats", "Short root threads drink water from passing clouds", "Bursts into a cloud of choking spores when hit", "Bright spots warn dragons not to bite it"],
  make() {
    const g = new THREE.Group();
    const capTex = canvasTex(256, 128, (x, w, h) => { x.fillStyle = "#d8508a"; x.fillRect(0, 0, w, h); x.fillStyle = "#fff4d8"; for (let i = 0; i < 16; i++) { x.beginPath(); x.ellipse(Math.random() * w, 10 + Math.random() * h * 0.6, 8 + Math.random() * 8, 12 + Math.random() * 10, 0, 0, Math.PI * 2); x.fill(); } });
    const cap = std("#d8508a", { map: capTex, roughness: 0.5 }), stem = std("#f2e6cc", { roughness: 0.8 }), gill = std("#f0b8cc", { roughness: 0.9 }), root = std("#d8cdb0");
    const body = new THREE.Group(); g.add(body);
    const capM = mesh(new THREE.SphereGeometry(0.7, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.62), cap, 0, 0, 0, 1, 0.95, 1); body.add(capM);
    body.add(mesh(new THREE.CircleGeometry(0.64, 28), gill, 0, -0.02, 0)).children; body.children[body.children.length - 1].rotation.x = Math.PI / 2;
    body.add(mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.55, 14), stem, 0, -0.3, 0));
    eyes(body, 0.2, -0.28, 0.09, 0.05, "#2a1a2a", false);
    body.add(mesh(sph(0.04, 8, 6), std("#7a2a3a"), 0.24, -0.4, 0, 0.6, 0.4, 1.6));
    const roots = [];
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const r = limb(new V(Math.cos(a) * 0.15, -0.55, Math.sin(a) * 0.15), new V(Math.cos(a) * 0.3, -1.05, Math.sin(a) * 0.3), 0.03, 0.008, root); body.add(r); roots.push(r); }
    const n = 80, pos = new Float32Array(n * 3), dir = []; for (let i = 0; i < n; i++) { const u = Math.random() * 6.28, v = Math.acos(2 * Math.random() - 1); dir.push(new V(Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u))); }
    const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const spores = new THREE.Points(pg, new THREE.PointsMaterial({ color: C("#e8f070"), size: 0.07, transparent: true, depthWrite: false })); g.add(spores);
    return { g, update: t => {
      const cyc = t % 6, burst = cyc > 4.5 ? (cyc - 4.5) / 1.5 : -1;
      body.position.y = 1.5 + Math.sin(t * 1.1) * 0.12;
      const puff = burst > 0 ? 1 - Math.sin(Math.min(1, burst * 3) * Math.PI) * 0.25 : 1 + Math.sin(t * 2) * 0.03;
      capM.scale.set(puff, puff * 0.95, puff);
      roots.forEach((r, i) => r.rotation.z = Math.sin(t * 2 + i) * 0.08);
      spores.visible = burst > 0;
      if (burst > 0) for (let i = 0; i < n; i++) { const d = dir[i], R = 0.4 + burst * 1.6; pos[i * 3] = d.x * R; pos[i * 3 + 1] = body.position.y + 0.2 + d.y * R * 0.7 - burst * 0.3; pos[i * 3 + 2] = d.z * R; }
      pg.attributes.position.needsUpdate = true; spores.material.opacity = 1 - Math.max(0, burst);
    } };
  } });

// Vine Dangler: hangs upside down under sky islands, grabs dragons flying below
MON.push({ name: "Vine Dangler", land: "Sky Islands (underneath)", ground: "#c8d4e4", ad: [
  "Hangs upside down from the roots under sky islands", "Green and brown like the hanging vines around it", "Long sticky arms grab dragons that fly underneath", "Cousin of the Vine Creeper, but it never touches the ground"],
  make() {
    const g = new THREE.Group(), vine = std("#4c6b2a"), skin = std("#5f8a3a", { roughness: 0.7, map: blotch("#5f8a3a", ["#3f6a28", "#7a6a3a", "#8ab050"], 60, 14) }),
      rock = std("#8b7d70", { roughness: 1 }), leaf = std("#3f8a3a", { side: THREE.DoubleSide }), glow = new THREE.MeshBasicMaterial({ color: C("#e8ff70") }), sticky = std("#c8e070", { roughness: 0.2 });
    // a chunk of island rock above it
    g.add(mesh(new THREE.ConeGeometry(1.4, 1.2, 9), rock, 0, 3.4, 0, 1, -1, 1));
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + 0.3; g.add(limb(new V(Math.cos(a) * 0.9, 2.85, Math.sin(a) * 0.9), new V(Math.cos(a) * 1.0, 1.6 + (i % 3) * 0.3, Math.sin(a) * 1.0), 0.04, 0.02, vine)); }
    const body = new THREE.Group(); body.position.y = 2.8; g.add(body);
    const hang = limb(new V(0, 0, 0), new V(0, -0.7, 0), 0.08, 0.1, vine); body.add(hang);
    const pod = new THREE.Group(); pod.position.y = -1.1; body.add(pod);
    pod.add(mesh(sph(0.35, 18, 12), skin, 0, 0, 0, 0.9, 1.25, 0.9));
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; const l = mesh(new THREE.PlaneGeometry(0.22, 0.4), leaf, Math.cos(a) * 0.3, 0.3, Math.sin(a) * 0.3); l.rotation.set(0, -a, 0.5); pod.add(l); }
    [1, -1].forEach(s => pod.add(mesh(sph(0.05, 10, 8), glow, 0.28, -0.12, 0.12 * s)));
    const arms = [];
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * Math.PI * 2 + Math.PI / 4, segs = []; let parent = new THREE.Group(); parent.position.set(Math.cos(a) * 0.2, -0.3, Math.sin(a) * 0.2); parent.rotation.y = -a; pod.add(parent);
      for (let i = 0; i < 7; i++) { const s = new THREE.Group(); s.position.y = i === 0 ? 0 : -0.18; parent.add(s); s.add(limb(new V(0, 0, 0), new V(0, -0.19, 0), 0.045 - i * 0.005, 0.04 - i * 0.005, vine)); segs.push(s); parent = s; }
      parent.add(mesh(sph(0.06, 10, 8), sticky, 0, -0.2, 0));

      body.rotation.z = Math.sin(t * 0.9) * 0.12; body.rotation.x = Math.sin(t * 0.7) * 0.08;
      const grab = Math.max(0, Math.sin(t * 0.8)) ** 3;
      arms.forEach(o => o.segs.forEach((s, i) => { s.rotation.z = 0.25 + Math.sin(t * 1.6 + o.ph + i * 0.5) * 0.12 - grab * 0.35; }));
    } };
  } });

// ---------- picker ----------
let cur = null, curDef = null;
const dock = document.getElementById("dock");
MON.forEach((m, i) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "m" + i; b.textContent = m.name;
  b.onclick = () => show(i); dock.appendChild(b);
});
function show(i) {
  if (cur) scene.remove(cur.g);
  curDef = MON[i]; cur = curDef.make(); scene.add(cur.g);
  ground.material.color.copy(C(curDef.ground));
  scene.background = C("#141a26");
  document.getElementById("nm").textContent = curDef.name;
  document.getElementById("land").textContent = curDef.land;
  document.getElementById("ad").innerHTML = curDef.ad.map(a => `<li>${a}</li>`).join("");
  dock.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", k === i));
  const box = new THREE.Box3().setFromObject(cur.g), h = box.max.y;
  controls.target.set(0, Math.max(0.6, h * 0.5), 0);
}
show(0);
window.__show = show;

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 600 ? 52 : 40; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock(); let T = 0;
(function tick() {
  const dt = Math.min(0.05, clock.getDelta()); T += dt;
  if (cur) cur.update(T, dt);
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick);
})();
})();
</script>
